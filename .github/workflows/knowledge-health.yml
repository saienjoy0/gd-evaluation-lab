name: Apply Exercise C Review Fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/exercise-c-medium-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema[format]>=4.23,<5"
      - name: Patch checkpoint negative control
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_exercise_c_review_fixes.py')
          source = path.read_text(encoding='utf-8')
          old = '    expect_rule_failure(loaded.runtime, "C-R01", lambda item: message(item, "m018").update(start_ms=400000, end_ms=410000))'
          new = '    expect_rule_failure(loaded.runtime, "C-R01", lambda item: [candidate.update(participant_id="not_target") for candidate in item["messages"] if candidate.get("speaker_type") == "user" and 290000 <= candidate.get("start_ms", 0) <= 380000])'
          if old not in source:
              raise SystemExit('checkpoint negative control line not found')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Apply reviewed fixes
        run: python scripts/apply_exercise_c_review_fixes.py
