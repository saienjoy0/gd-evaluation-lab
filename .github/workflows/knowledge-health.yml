name: Evaluation Health

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Exercise B review fixes
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"PATCH_TARGET_MISSING: {path}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          generator = "scripts/generate_exercise_b_high_low.py"
          target = Path(generator)
          text = target.read_text(encoding="utf-8")
          text = text.replace("import copy\n", "")
          text = text.replace(
              '    episode.setdefault("versions", {})["prompt_version"] = f"exercise-b-{state}-script-v0.1"\n',
              "",
          )
          old_low = '''    if state == "low":
              episode["events"] = [
                  event
                  for event in episode["events"]
                  if event.get("event") != "POSITIONS_INTEGRATED"
              ]
              for event in episode["events"]:
                  if event.get("event") == "PRIVATE_CONCERN_REVEALED":
                      event["candidate_response_message_ids"] = []
                  if event.get("event") == "DECISION_ALLOCATION_RECORDED":
                      event["fields"] = [
                          field for field in event.get("fields", []) if field != "mitigation"
                      ]
          '''
          new_low = '''    if state == "low":
              episode["events"] = [
                  event
                  for event in episode["events"]
                  if event.get("event")
                  not in {"POSITIONS_INTEGRATED", "MINORITY_CONCERN_STATUS"}
              ]
              for event in episode["events"]:
                  event_type = event.get("event")
                  if event_type == "PRIVATE_CONCERN_REVEALED":
                      event["candidate_response_message_ids"] = []
                  elif event_type == "DECISION_ALLOCATION_RECORDED":
                      event["fields"] = [
                          field
                          for field in event.get("fields", [])
                          if field != "mitigation"
                      ]
                      event.pop("mitigation", None)
                  elif event_type == "SUMMARY_FIELDS_RECORDED":
                      event["fields"] = ["allocation"]
          '''
          if new_low not in text:
              if old_low not in text:
                  raise SystemExit("GENERATOR_LOW_PATCH_TARGET_MISSING")
              text = text.replace(old_low, new_low, 1)
          target.write_text(text, encoding="utf-8")

          replace_exact(
              "gd_eval/results/evaluation_result.py",
              '''def _display_groups(
              candidate_dimensions: list[dict[str, Any]],
              candidate_rubric: dict[str, Any],
          ) -> dict[str, Any]:''',
              '''def _display_groups(
              exercise_id: str,
              candidate_dimensions: list[dict[str, Any]],
              candidate_rubric: dict[str, Any],
          ) -> dict[str, Any]:''',
          )
          replace_exact(
              "gd_eval/results/evaluation_result.py",
              '''        groups[group_id] = {
                  "aggregation_status": "not_calibrated",
                  "score": None,
                  "coverage": {
                      "evaluated": len(numeric),
                      "total": len(group_dimensions),
                  },
                  "bottleneck_dimension": bottleneck,
                  "summary": group_summary(bottleneck or "", fallback),
              }''',
              '''        use_observed_fallback = (
                  exercise_id == "candidate-assessment-b-stakeholder-conflict"
                  and bottleneck is not None
                  and int(dimension_map[bottleneck]["score"]) <= 1
              )
              groups[group_id] = {
                  "aggregation_status": "not_calibrated",
                  "score": None,
                  "coverage": {
                      "evaluated": len(numeric),
                      "total": len(group_dimensions),
                  },
                  "bottleneck_dimension": bottleneck,
                  "summary": (
                      fallback
                      if use_observed_fallback
                      else group_summary(bottleneck or "", fallback)
                  ),
              }''',
          )
          replace_exact(
              "gd_eval/results/evaluation_result.py",
              '        "display_groups": _display_groups(candidate_dimensions, candidate_rubric),',
              '        "display_groups": _display_groups(\n            exercise_id, candidate_dimensions, candidate_rubric\n        ),',
          )

          checker = Path("scripts/check_exercise_b_high_low.py")
          text = checker.read_text(encoding="utf-8")
          helpers = '''\n\ndef assert_prompt_control(loaded_by_state) -> None:\n    prompt_versions = {\n        loaded.runtime.episode["versions"]["prompt_version"]\n        for loaded in loaded_by_state.values()\n    }\n    if len(prompt_versions) != 1:\n        raise AssertionError(f"PROMPT_VERSION_DIFFER: {sorted(prompt_versions)}")\n\n\ndef assert_low_semantic_consistency(loaded, generated) -> None:\n    events = loaded.runtime.episode["events"]\n    decision = next(\n        event for event in events if event.get("event") == "DECISION_ALLOCATION_RECORDED"\n    )\n    if "mitigation" in decision or "mitigation" in decision.get("fields", []):\n        raise AssertionError("LOW_FALSE_MITIGATION_EVENT")\n    if any(event.get("event") == "MINORITY_CONCERN_STATUS" for event in events):\n        raise AssertionError("LOW_FALSE_MINORITY_ADDRESS_EVENT")\n    summary = next(\n        event for event in events if event.get("event") == "SUMMARY_FIELDS_RECORDED"\n    )\n    if summary.get("fields") != ["allocation"]:\n        raise AssertionError(f"LOW_FALSE_SUMMARY_FIELDS: {summary.get('fields')}")\n\n    dimensions = {\n        item["dimension"]: item\n        for item in generated.evaluation_result["candidate_dimensions"]\n    }\n    for group_id, group in generated.feedback["display_groups"].items():\n        bottleneck = group["bottleneck_dimension"]\n        expected = dimensions[bottleneck]["missing_behavior"]\n        if group["summary"] != expected:\n            raise AssertionError(\n                f"LOW_FALSE_GROUP_SUMMARY: {group_id}: {group['summary']}"\n            )\n'''
          if "def assert_prompt_control" not in text:
              text = text.replace("\ndef main() -> None:\n", helpers + "\n\ndef main() -> None:\n", 1)
          call_block = '''    assert_unique_case_identity(loaded_by_state)
          '''
          replacement = '''    assert_unique_case_identity(loaded_by_state)
              assert_prompt_control(loaded_by_state)
              assert_low_semantic_consistency(
                  loaded_by_state["low"], generated_by_state["low"]
              )
          '''
          if "assert_low_semantic_consistency(" not in text.split("def main() -> None:", 1)[1]:
              if call_block not in text:
                  raise SystemExit("CHECKER_CALL_TARGET_MISSING")
              text = text.replace(call_block, replacement, 1)
          checker.write_text(text, encoding="utf-8")
          PY
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema[format]>=4.23,<5"
      - name: Regenerate Exercise B high/low fixtures
        run: python scripts/generate_exercise_b_high_low.py
      - name: Validate knowledge notes
        run: python scripts/check_knowledge.py
      - name: Validate evaluation contract
        run: python scripts/check_evaluation_contract.py
      - name: Validate human annotation foundation
        run: python scripts/check_annotation_foundation.py
      - name: Validate candidate assessment scenario pack
        run: python scripts/check_candidate_scenario_pack.py
      - name: Validate contract and scenario hardening
        run: python scripts/check_contract_hardening.py
      - name: Validate generic full-Episode runner
        run: python scripts/check_full_episode_runner.py
      - name: Validate Exercise A high/low calibration
        run: python scripts/check_exercise_a_high_low.py
      - name: Validate Exercise A system failure separation
        run: python scripts/check_exercise_a_system_failure.py
      - name: Validate numeric evidence provenance
        run: python scripts/check_numeric_evidence_provenance.py
      - name: Validate Exercise A four-state matrix
        run: python scripts/check_exercise_a_four_state_matrix.py
      - name: Validate Exercise B medium vertical slice
        run: python scripts/check_exercise_b_medium.py
      - name: Validate Exercise B high/low calibration
        run: python scripts/check_exercise_b_high_low.py
      - name: Commit review fixes and regenerated fixtures
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            gd_eval/results/evaluation_result.py \
            scripts/generate_exercise_b_high_low.py \
            scripts/check_exercise_b_high_low.py \
            fixtures/calibration/full-episodes/stakeholder-conflict/high \
            fixtures/calibration/full-episodes/stakeholder-conflict/low
          if ! git diff --cached --quiet; then
            git commit -m "Fix Exercise B low semantic consistency"
            git push origin HEAD:${{ github.head_ref }}
          fi
