name: Evaluation Health

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema[format]>=4.23,<5"
      - name: Check out PR head for reviewed summary fix
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout -B "${GITHUB_HEAD_REF}" "origin/${GITHUB_HEAD_REF}"
      - name: Apply and persist Exercise C display summary fix
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("gd_eval/results/evaluation_result.py")
          text = path.read_text(encoding="utf-8")
          old = '''        use_observed_fallback = (
              exercise_id == "candidate-assessment-b-stakeholder-conflict"
              and bottleneck is not None
              and int(dimension_map[bottleneck]["score"]) <= 1
          )'''
          new = '''        use_observed_fallback = (
              exercise_id == "candidate-assessment-c-time-boxed-decision"
              or (
                  exercise_id == "candidate-assessment-b-stakeholder-conflict"
                  and bottleneck is not None
                  and int(dimension_map[bottleneck]["score"]) <= 1
              )
          )'''
          if old not in text:
              raise SystemExit("DISPLAY_GROUP_FIX_TARGET_NOT_FOUND")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python scripts/generate_exercise_c_medium.py
          python scripts/generate_exercise_c_high_low.py
          python scripts/check_exercise_c_medium.py
          python scripts/check_exercise_c_review_regressions.py
          python scripts/check_exercise_c_high_low.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            gd_eval/results/evaluation_result.py \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/evaluation-result.json \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/expected-feedback.json \
            fixtures/calibration/full-episodes/time-boxed-decision/high/evaluation-result.json \
            fixtures/calibration/full-episodes/time-boxed-decision/high/expected-feedback.json \
            fixtures/calibration/full-episodes/time-boxed-decision/low/evaluation-result.json \
            fixtures/calibration/full-episodes/time-boxed-decision/low/expected-feedback.json
          if git diff --cached --quiet; then
            echo "Exercise C display summaries already fixed"
            exit 0
          fi
          git commit -m "Align Exercise C display summaries with evidence"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Validate knowledge notes
        run: python scripts/check_knowledge.py
      - name: Validate evaluation contract
        run: python scripts/check_evaluation_contract.py
      - name: Validate human annotation foundation
        run: python scripts/check_annotation_foundation.py
      - name: Validate candidate assessment scenario pack
        run: python scripts/check_candidate_scenario_pack.py
      - name: Validate contract and scenario hardening
        run: python scripts/check_contract_hardening.py
      - name: Validate generic full-Episode runner
        run: python scripts/check_full_episode_runner.py
      - name: Validate Exercise A high/low calibration
        run: python scripts/check_exercise_a_high_low.py
      - name: Validate Exercise A system failure separation
        run: python scripts/check_exercise_a_system_failure.py
      - name: Validate numeric evidence provenance
        run: python scripts/check_numeric_evidence_provenance.py
      - name: Validate Exercise A four-state matrix
        run: python scripts/check_exercise_a_four_state_matrix.py
      - name: Validate Exercise B medium vertical slice
        run: python scripts/check_exercise_b_medium.py
      - name: Validate Exercise B high/low calibration
        run: python scripts/check_exercise_b_high_low.py
      - name: Validate Exercise B fixture generator reproducibility
        run: |
          python scripts/generate_exercise_b_high_low.py
          git diff --exit-code -- \
            fixtures/calibration/full-episodes/stakeholder-conflict/high \
            fixtures/calibration/full-episodes/stakeholder-conflict/low
          python scripts/check_exercise_b_high_low.py
      - name: Validate Exercise B system failure separation
        run: python scripts/check_exercise_b_system_failure.py
      - name: Validate Exercise B system failure generator reproducibility
        run: |
          python scripts/generate_exercise_b_system_failure.py
          git diff --exit-code -- \
            fixtures/calibration/full-episodes/stakeholder-conflict/system_failure
          python scripts/check_exercise_b_system_failure.py
      - name: Validate Exercise B four-state matrix
        run: python scripts/check_exercise_b_four_state_matrix.py
      - name: Validate Exercise C medium vertical slice
        run: |
          python scripts/generate_exercise_c_medium.py
          git diff --exit-code -- \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/deterministic-rule-result.json \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/system-quality-result.json \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/opportunity-resolution.json \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/evaluation-result.json \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/expected-feedback.json
          python scripts/check_exercise_c_medium.py
          python scripts/check_exercise_c_review_regressions.py
      - name: Validate Exercise C high/low calibration
        run: |
          python scripts/generate_exercise_c_high_low.py
          git diff --exit-code -- \
            fixtures/calibration/full-episodes/time-boxed-decision/high \
            fixtures/calibration/full-episodes/time-boxed-decision/low
          python scripts/check_exercise_c_high_low.py
