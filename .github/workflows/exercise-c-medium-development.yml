name: Exercise C Medium Development

on:
  push:
    branches: [feat/exercise-c-medium-v0.1]
    paths-ignore:
      - "fixtures/calibration/full-episodes/time-boxed-decision/medium/**"

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/exercise-c-medium-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema[format]>=4.23,<5"
      - name: Materialize authored Episode
        run: python scripts/materialize_exercise_c_medium_episode.py
      - name: Generate deterministic goldens
        run: python scripts/generate_exercise_c_medium.py
      - name: Validate Exercise C medium
        run: python scripts/check_exercise_c_medium.py
      - name: Validate Exercise A matrix regression
        run: python scripts/check_exercise_a_four_state_matrix.py
      - name: Validate Exercise B matrix regression
        run: python scripts/check_exercise_b_four_state_matrix.py
      - name: Commit generated fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/episode.json \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/deterministic-rule-result.json \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/system-quality-result.json \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/opportunity-resolution.json \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/evaluation-result.json \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/expected-feedback.json
          if git diff --cached --quiet; then
            echo "Generated fixture already current"
          else
            git commit -m "test: generate Exercise C medium fixture"
            git push origin HEAD:feat/exercise-c-medium-v0.1
          fi
