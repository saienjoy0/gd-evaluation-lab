name: Apply Exercise C review fixes v2

on:
  push:
    branches: [feat/exercise-c-medium-v0.1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/exercise-c-medium-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema[format]>=4.23,<5"
      - name: Apply review fixes in workspace
        run: |
          python - <<'PY'
          import base64
          import gzip
          import json
          from pathlib import Path

          payload = Path('scripts/.exercise_c_checker.gz.b64').read_text().strip()
          Path('scripts/check_exercise_c_medium.py').write_bytes(
              gzip.decompress(base64.b64decode(payload, validate=True))
          )

          scenario_path = Path(
              'fixtures/scenarios/candidate-assessment-c-time-boxed-decision-v0.1.json'
          )
          scenario = json.loads(scenario_path.read_text(encoding='utf-8'))
          opportunities = {
              item['opportunity_id']: item
              for item in scenario['evaluation_opportunities']
          }
          opportunities['C-OP-VA-01']['trigger'] = (
              'after_training_initial_positions'
          )
          rubrics = {
              item['rubric_id']: item
              for item in scenario['instance_rubrics']
          }
          rubrics['C-R02']['rule']['params']['allowed_trigger_moves'] = [
              'ask_question'
          ]
          rubrics['C-R05']['rule']['deterministic_rule_id'] = (
              'candidate_summary_contains_fields'
          )
          scenario_path.write_text(
              json.dumps(
                  scenario,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(',', ':'),
              ) + '\n',
              encoding='utf-8',
          )

          episode_path = Path(
              'fixtures/calibration/full-episodes/time-boxed-decision/medium/episode.json'
          )
          episode = json.loads(episode_path.read_text(encoding='utf-8'))
          events = {item['event_id']: item for item in episode['events']}
          bindings = {
              'ev_options_presented': ('m003', 44000),
              'ev_success_requirements': ('m004', 56000),
              'ev_collision': ('m021', 370000),
              'ev_revision': ('m028', 500000),
              'ev_unresolved': ('m030', 535000),
          }
          for event_id, (message_id, timestamp_ms) in bindings.items():
              events[event_id]['message_id'] = message_id
              events[event_id]['timestamp_ms'] = timestamp_ms
          episode_path.write_text(
              json.dumps(
                  episode,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(',', ':'),
              ) + '\n',
              encoding='utf-8',
          )

          rule_path = Path('gd_eval/rules/time_boxed_decision.py')
          source = rule_path.read_text(encoding='utf-8')
          old = '''            triggered = any(
                prior.get("speaker_type") == "user"
                and prior.get("participant_id") == target
                and prior.get("move") == trigger_move
                and prior.get("end_ms", 0) <= message.get("start_ms", 0)
                for prior in messages
            )'''
          new = '''            triggered = any(
                prior.get("move") == trigger_move
                and prior.get("end_ms", 0) <= message.get("start_ms", 0)
                and prior.get("message_id") != message.get("message_id")
                for prior in messages
            )'''
          if old not in source:
              raise SystemExit('C-R02 trigger block not found')
          rule_path.write_text(source.replace(old, new), encoding='utf-8')

          workflow_path = Path('.github/workflows/knowledge-health.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = workflow.replace(
              '          python scripts/materialize_exercise_c_medium_episode.py\n',
              '',
          )
          workflow_path.write_text(workflow, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              'fixtures/calibration/full-episodes/time-boxed-decision/medium/episode.json.gz.b64',
              'fixtures/calibration/full-episodes/time-boxed-decision/medium/episode.json',
          )
          readme = readme.replace(
              'python scripts/materialize_exercise_c_medium_episode.py\n',
              '',
          )
          readme_path.write_text(readme, encoding='utf-8')

          doc_path = Path('docs/EXERCISE_C_MEDIUM_VERTICAL_SLICE.md')
          doc = doc_path.read_text(encoding='utf-8')
          start = doc.index('## 9. Episode正本')
          end = doc.index('## 10. 検査')
          replacement = '''## 9. Episode正本

Episodeは次のJSONファイルを直接の正本とする。

```text
fixtures/calibration/full-episodes/time-boxed-decision/medium/episode.json
```

`case.json`から共通loaderで直接読み込めるため、Exercise A・Bと同じFull-Episode契約で扱える。

`transcript_hash`は次で固定する。

```text
84ddd149a37e39fff933357d1a60e75ca1dde9afaa73724a8ebdf55c1b9ca1f6
```

構造化イベントは、対応する発言IDと発言時間帯へ結び付けて検査する。イベント名や任意時刻だけでは証拠として扱わない。

'''
          doc = doc[:start] + replacement + doc[end:]
          doc = doc.replace(
              'python scripts/materialize_exercise_c_medium_episode.py\n',
              '',
          )
          old_sentence = (
              'checkerは正常系に加え、時間通知欠落、時刻逸脱、リスクの決定後開示、'
              '誤ったconcern、優先順位更新欠落、三案比較不足、revision欠落、'
              '要約field欠落、AI先回り決定、summary欠落、証拠所有者不整合を'
              'fail-closedで検査する。'
          )
          new_sentence = (
              'checkerは正常系に加え、trigger名前空間衝突、イベント時刻偽装、'
              '時間通知欠落、遅延リスクの誤開示、優先順位更新欠落、三案比較不足、'
              'revision不整合、要約の所有者・値、AI先回り決定、summary欠落、'
              '未実装trigger/context、phase・dimension・証拠所有者不整合を'
              '31件の負例でfail-closedに検査する。'
          )
          doc = doc.replace(old_sentence, new_sentence)
          doc_path.write_text(doc, encoding='utf-8')
          PY
      - name: Regenerate and validate
        id: validation
        continue-on-error: true
        run: |
          set +e
          python scripts/generate_exercise_c_medium.py > /tmp/exercise-c-review.log 2>&1
          generator_status=$?
          python scripts/check_exercise_c_medium.py >> /tmp/exercise-c-review.log 2>&1
          checker_status=$?
          printf '\ngenerator_status=%s\nchecker_status=%s\n' \
            "$generator_status" "$checker_status" >> /tmp/exercise-c-review.log
          if [ "$generator_status" -eq 0 ] && [ "$checker_status" -eq 0 ]; then
            echo 'passed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'passed=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Commit successful fixes
        if: steps.validation.outputs.passed == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            .github/workflows/knowledge-health.yml \
            README.md \
            docs/EXERCISE_C_MEDIUM_VERTICAL_SLICE.md \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/episode.json \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/deterministic-rule-result.json \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/system-quality-result.json \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/opportunity-resolution.json \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/evaluation-result.json \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/expected-feedback.json \
            fixtures/scenarios/candidate-assessment-c-time-boxed-decision-v0.1.json \
            gd_eval/rules/time_boxed_decision.py \
            scripts/check_exercise_c_medium.py
          git rm -- \
            .github/workflows/apply-exercise-c-review-fixes-v2.yml \
            scripts/.exercise_c_checker.gz.b64 \
            fixtures/calibration/full-episodes/time-boxed-decision/medium/episode.json.gz.b64 \
            scripts/materialize_exercise_c_medium_episode.py
          git commit -m "fix: harden Exercise C evidence provenance"
          git push origin HEAD:feat/exercise-c-medium-v0.1
      - name: Commit diagnostic log
        if: steps.validation.outputs.passed != 'true'
        run: |
          cp /tmp/exercise-c-review.log /tmp/exercise-c-review-copy.log
          git restore --worktree --staged .
          cp /tmp/exercise-c-review-copy.log docs/EXERCISE_C_REVIEW_FIX_LOG.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/EXERCISE_C_REVIEW_FIX_LOG.txt
          git rm -- \
            .github/workflows/apply-exercise-c-review-fixes-v2.yml \
            scripts/.exercise_c_checker.gz.b64
          git commit -m "chore: capture Exercise C review fix diagnostics"
          git push origin HEAD:feat/exercise-c-medium-v0.1
